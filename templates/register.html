{% extends 'base.html' %}
{% block content %}
<section>
  <h2><i class="ph-fill ph-file-plus"></i> Đăng ký chứng từ tài chính</h2>
  <p>Tính năng: <strong>Digital Fingerprinting + Proof of Existence</strong> trên mạng thử nghiệm.</p>
  
  <form method="post" enctype="multipart/form-data">
    <label>
      <span><i class="ph ph-user"></i> Người khởi tạo</span>
      <input type="text" name="creator" placeholder="VD: Công ty XNK ABC" required />
    </label>
    <label>
      <span><i class="ph ph-user-focus"></i> Chủ sở hữu ban đầu</span>
      <input type="text" name="owner" placeholder="VD: Ngân hàng Á Châu" required />
    </label>
    <label>
      <span><i class="ph ph-file-pdf"></i> Tệp PDF chứng từ</span>
      <input type="file" name="pdf" accept="application/pdf" required />
    </label>
    <button type="submit"><i class="ph ph-fingerprint"></i> Tạo fingerprint & Ghi sổ cái</button>
  </form>
</section>
{% endblock %}
